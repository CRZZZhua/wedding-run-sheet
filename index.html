<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="广州庭院婚礼公开执行表。按岗位查看当天时间线、婚前确认和天气预案。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f5ed">
  <title>广州庭院婚礼执行台</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip" href="#schedule">跳到当天排程</a>
  <header class="masthead">
    <div class="wrap">
      <p class="eyebrow">婚礼执行台 <span>／</span> 公开执行表</p>
      <h1>广州庭院婚礼</h1>
      <p id="event-date" class="event-date"></p>
      <div id="site-status" class="site-status" role="status">正在载入排程…</div>
      <a id="version-link" class="version-link" href="#version" hidden></a>
      <noscript><p>请启用 JavaScript 后重新打开执行表，或向统筹索取带版本日期的岗位打印件。</p></noscript>
    </div>
  </header>
  <main class="wrap" id="app" hidden>
    <nav class="site-nav" aria-label="页面导航">
      <a href="#schedule">当天排程</a>
      <a href="#checklist">婚前确认</a>
      <a href="#weather">天气预案</a>
      <a href="#contacts">岗位联络</a>
    </nav>
    <section id="schedule" aria-labelledby="schedule-heading">
      <div class="section-heading">
        <div><p class="eyebrow">01 / 婚礼当天</p><h2 id="schedule-heading">当天总览</h2></div>
        <div class="toolbar">
          <button id="share" type="button">复制链接</button>
          <button id="print" type="button">打印排程</button>
        </div>
      </div>
      <nav id="roles" class="pills" aria-label="按岗位查看"></nav>
      <p id="share-status" class="feedback" role="status"></p>
      <aside id="next" class="next" aria-label="计划任务" hidden></aside>
      <nav id="stages" class="pills stage-nav" aria-label="跳转流程阶段"></nav>
      <div id="timeline"></div>
    </section>
    <section id="checklist" class="support" aria-labelledby="checklist-heading">
      <p class="eyebrow">02 / 婚礼前</p>
      <h2 id="checklist-heading">婚前确认</h2>
      <ul id="checklist-items" class="checklist"></ul>
    </section>
    <section id="weather" class="support" aria-labelledby="weather-heading">
      <p class="eyebrow">03 / 现场预案</p>
      <h2 id="weather-heading">天气预案</h2>
      <div id="weather-detail"></div>
    </section>
    <section id="contacts" class="support" aria-labelledby="contacts-heading">
      <p class="eyebrow">04 / 现场交接</p>
      <h2 id="contacts-heading">岗位联络</h2>
      <div id="contact-detail"></div>
    </section>
  </main>
  <footer id="version" class="wrap footer" hidden></footer>
</body>
</html>
