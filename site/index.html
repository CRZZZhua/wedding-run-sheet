
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="广州庭院婚礼公开执行表。查看当天流程、婚前确认、现场预案和活动灵感。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFDF8">
  <title>广州庭院婚礼执行台</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="masthead">
    <div class="wrap">
      <div class="mast-row">
        <p class="eyebrow">婚礼执行台 <span>／</span> 公开执行表</p>
        <details id="more" class="more" hidden>
          <summary>更多操作</summary>
          <div class="menu">
            <button id="history-button" type="button">更新记录</button>
            <button id="share" type="button">复制当前链接</button>
            <button id="print" type="button">打印当前视图</button>
          </div>
        </details>
      </div>
      <h1 id="title">广州庭院婚礼</h1>
      <p id="event-date" class="event-date"></p>
      <p id="revision" class="revision"></p>
      <div id="site-status" class="site-status" role="status">正在载入排程…</div>
      <aside id="updates" class="notice" aria-live="polite" hidden></aside>
      <p id="share-status" class="feedback" role="status"></p>
      <noscript><p>请启用 JavaScript，或向统筹索取岗位打印件。</p></noscript>
    </div>
  </header>
  <main class="wrap" id="main" tabindex="-1" hidden>
    <nav class="site-nav" aria-label="页面导航" id="navigation"></nav>
    <div id="page"></div>
    <section id="print-weather" class="print-only" aria-label="打印天气预案"></section>
  </main>
  <footer class="wrap footer" id="footer" hidden>
    <p>开场、音乐、上菜及天气切换以统筹现场口令为准。</p>
    <p id="last-check" aria-live="polite"></p>
  </footer>
  <dialog id="history" aria-labelledby="history-title">
    <h2 id="history-title">更新记录</h2>
    <div id="history-content"></div>
    <form method="dialog"><button type="submit">关闭</button></form>
  </dialog>
  <template id="activities-template">
    <section aria-labelledby="activities-title">
      <header class="activities-intro">
        <p class="eyebrow">宾客互动 · 待确认提案</p>
        <h2 id="activities-title">活动灵感</h2>
        <p>从迎宾到晚宴，宾客可以选礼物、插一枝花、拍下婚礼瞬间，也可以为今晚的歌写一句词。</p>
      </header>
      <div class="activity-grid">
        <article class="activity">
          <img src="./images/gift-boxes.jpg" width="1200" height="800" alt="庭院迎宾桌上摆着系有浅绿色缎带的小礼盒、线索卡和一罐茶">
          <div class="activity-copy">
            <p class="eyebrow">01 ／ 迎宾陈列 · 晚宴拆礼</p>
            <h3>礼物盲盒</h3>
            <p>每份礼物配一句线索。宾客挑一句喜欢的，把惊喜留到拆盒时。</p>
            <details>
              <summary>查看玩法与礼物示例</summary>
              <ol>
                <li>迎宾时陈列包好的礼物，让宾客边逛边看。</li>
                <li>晚宴后段用一两句话介绍玩法，各桌传阅线索卡，每人选一句。多人选中同一句时，从选这句的人里抽出一位。</li>
                <li>获赠的宾客可以在桌边拆礼物，也可以互相看看大家抽到了什么。</li>
              </ol>
              <p><strong>到场先选卡</strong>　也可以让宾客签到时选一张写有礼物关键词的卡，晚宴时从参与的宾客中抽人，按卡片领取对应礼物并当场拆开。</p>
              <p><strong>礼物数量</strong>　人人有份时，准备价值相近的小物，选过的卡直接取走。礼物较少时，可把「选线索，再抽中选者」做成晚宴里的短环节。</p>
              <table class="gift-examples">
                <caption>线索与礼物示例</caption>
                <thead><tr><th scope="col">包装上的话</th><th scope="col">礼物</th></tr></thead>
                <tbody>
                  <tr><td>把今天泡得久一点</td><td>一小罐茶</td></tr>
                  <tr><td>送给想赖床的下一个周末</td><td>一双柔软的袜子</td></tr>
                  <tr><td>留给某个下雨的下午</td><td>热巧克力冲饮</td></tr>
                  <tr><td>把今晚的一小束光带回家</td><td>一只小烛台</td></tr>
                  <tr><td>给那些值得记下来的小事</td><td>一本口袋笔记本</td></tr>
                </tbody>
              </table>
            </details>
          </div>
        </article>
        <article class="activity">
          <img src="./images/shared-flowers.jpg" width="1200" height="800" alt="一位宾客把一枝杏色花插进迎宾桌上的玻璃花瓶">
          <div class="activity-copy">
            <p class="eyebrow">02 ／ 迎宾插花 · 晚宴上桌</p>
            <h3>大家一起把餐桌插满</h3>
            <p>每人插一枝，半分钟就能参与。宾客一起完成的几瓶花，会出现在晚宴上。</p>
            <details>
              <summary>查看布置与花瓶交接</summary>
              <ol>
                <li>迎宾区摆三到五只装好水的花器，备好提前剪枝、去刺的花材，颜色沿用婚礼布置。</li>
                <li>宾客各选一枝插进任意花瓶。想多待一会儿的人，也可以帮忙搭配颜色。</li>
                <li>庭院仪式前收台，请一位朋友把花移到餐厅入口、吧台或餐桌。摄影师可在宾客进餐厅前拍一张完成照。</li>
              </ol>
              <blockquote>选一枝你喜欢的花，插进任意一只花瓶。今晚，它会和我们一起上桌。</blockquote>
              <p><strong>散场带走</strong>　也可以把部分花枝分成小束，作为伴手礼送给宾客。</p>
            </details>
          </div>
        </article>
        <article class="activity">
          <img src="./images/photo-missions.jpg" width="1200" height="800" alt="一位宾客用手机拍下庭院晚宴上两位朋友笑成一团的瞬间">
          <div class="activity-copy">
            <p class="eyebrow">03 ／ 迎宾至晚宴</p>
            <h3>拍照任务</h3>
            <p>每桌放一张可任选题目的任务卡，请宾客用手机拍下自己留意到的婚礼瞬间。</p>
            <details>
              <summary>查看任务卡与分享方式</summary>
              <ul>
                <li>拍一张有人笑到模糊的照片</li>
                <li>拍下一双今天很忙的手</li>
                <li>拍一处你喜欢的布置</li>
              </ul>
              <p><strong>姿势卡玩法</strong>　也可以抽一张拍照姿势卡，照着卡上的姿势合影。</p>
              <p><strong>照片分享</strong>　愿意分享的宾客可以把照片传到新人指定的相册。现场有屏幕时，可以在晚宴轮播愿意公开分享的照片。</p>
            </details>
          </div>
        </article>
        <article class="activity">
          <img src="./images/lyric-cards.jpg" width="1200" height="800" alt="一位宾客在庭院迎宾桌前，用笔填写米白色歌词卡">
          <div class="activity-copy">
            <p class="eyebrow">04 ／ 迎宾填词 · 晚宴放歌</p>
            <h3>一起谱写一首歌词</h3>
            <p>每位宾客选一张歌词卡，填一句、签上名字。大家写的句子会在晚宴上变成一首歌。</p>
            <details>
              <summary>查看歌词卡与放歌流程</summary>
              <ol>
                <li>提前准备几种留有空格的歌词卡。迎宾时请每位宾客选一张，写下自己的名字，再填完卡上的句子。</li>
                <li>收齐卡片后，马上把填好的句子整理成一首歌词，交给 AI 作曲并生成演唱音频。</li>
                <li>晚宴上，新郎新娘先把歌词念给大家听，念完再播放制作好的歌。</li>
              </ol>
              <blockquote>
                <p>我想把今天的＿＿＿，写进你们往后的日子。</p>
                <p>填词人　＿＿＿</p>
              </blockquote>
            </details>
          </div>
        </article>
      </div>
    </section>
  </template>
</body>
</html>
